name: External Upload Windows App

# Fork branch validation only; no release or upstream PR is created.
on:
  push:
    branches: ['fix/external-drop-rsync']
    paths:
      - '.github/workflows/external-upload-windows.yml'
      - '.github/scripts/external-upload-windows-*.ps1'
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/windows-drop-bridge/**'
      - 'scripts/**'
      - 'patches/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '*config*'
      - 'index.html'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-upload-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    if: github.repository == 'lovitus/aeroftp' && github.ref == 'refs/heads/fix/external-drop-rsync'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install npm dependencies
        timeout-minutes: 10
        run: npm ci
      - name: Check CI runtime driver syntax
        run: node --check scripts/test-windows-external-drop.mjs
      - name: Typecheck
        timeout-minutes: 5
        run: npm run typecheck
      - name: External drop and file batch regression tests
        timeout-minutes: 5
        run: npx vitest run src/hooks/useDragAndDrop.samePlace.test.ts src/hooks/useDragAndDrop.external.test.ts src/utils/externalFileDrop.test.ts src/utils/fileBatchRouting.test.ts src/utils/fileBatchRouting.wiring.test.ts
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tests/windows-drop-bridge -> target
          prefix-key: external-upload-bridge-v1
      - name: Production WebView2 bridge tests
        timeout-minutes: 20
        run: cargo test --manifest-path tests/windows-drop-bridge/Cargo.toml --target x86_64-pc-windows-msvc --lib -- --nocapture
      - name: Development origin bridge configuration
        timeout-minutes: 10
        env:
          RUSTFLAGS: --cfg dev
        run: cargo check --manifest-path tests/windows-drop-bridge/Cargo.toml --target x86_64-pc-windows-msvc --lib

  production-app:
    needs: focused-tests
    if: github.repository == 'lovitus/aeroftp' && github.ref == 'refs/heads/fix/external-drop-rsync'
    # VS 17 2022 avoids the cmake-rs / VS 18 generator mismatch documented
    # in windows-unit-tests.yml. Keep repository static-CRT settings intact.
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Configure native Windows build tools
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'VS 2022 C++ toolchain not found' }
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($entry in Get-ChildItem Env:) {
            if ($entry.Name -match '^(PATH|INCLUDE|LIB|LIBPATH|VC.*|VS.*|WindowsSdk.*|UniversalCRT.*|UCRT.*)$') {
              "$( $entry.Name )=$( $entry.Value )" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if (-not (Test-Path 'C:/Strawberry/perl/bin/perl.exe')) { throw 'Strawberry Perl missing on runner' }
          'C:/Strawberry/perl/bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          if (-not (Test-Path 'C:/Program Files/LLVM/bin/libclang.dll')) { throw 'LLVM libclang missing on runner' }
          'LIBCLANG_PATH=C:/Program Files/LLVM/bin' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'CMAKE_GENERATOR=Visual Studio 17 2022' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'
          prefix-key: external-upload-windows-v3-whisper-purge
          cache-on-failure: true
      - name: Drop stale whisper CMake artifacts
        run: |
          foreach ($profile in @('debug', 'release')) {
            $base = "src-tauri/target/$profile/build"
            if (Test-Path $base) {
              Get-ChildItem $base -Directory -Filter 'whisper-rs-sys-*' | Remove-Item -Recurse -Force -ErrorAction Stop
            }
          }
      - name: Install npm dependencies
        timeout-minutes: 10
        run: npm ci
      - name: Rust formatting gate
        working-directory: src-tauri
        timeout-minutes: 5
        run: cargo fmt --all -- --check
      - name: Security regression gate
        timeout-minutes: 5
        run: npm run security:regression
      - name: Full production Tauri build (all default features)
        timeout-minutes: 100
        # Runs the real beforeBuildCommand and beforeBundleCommand. No config
        # override, feature pruning, or test-only frontend is used here.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run tauri build -- --ci
      - name: Build Windows application unit test executable (native rsync retained)
        working-directory: src-tauri
        timeout-minutes: 55
        env:
          AEROFTP_EMBED_TEST_MANIFEST: '1'
        # Match windows-unit-tests.yml: exclude local-stt only from the test
        # executable to avoid its documented whisper test-link CRT failure.
        # The shipping Tauri build above retains every default feature.
        run: cargo test --locked --release --lib --no-default-features --features aerorsync,proton-native --no-run
      - name: Run production application Windows bridge tests
        working-directory: src-tauri
        timeout-minutes: 10
        env:
          AEROFTP_EMBED_TEST_MANIFEST: '1'
        run: |
          $output = @(cargo test --locked --release --lib --no-default-features --features aerorsync,proton-native windows_external_drop:: -- --nocapture 2>&1)
          $status = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($status -ne 0) { exit $status }
          $summary = ($output | ForEach-Object { "$_" }) -join [Environment]::NewLine
          if ($summary -notmatch 'test result: ok\. (\d+) passed;' -or [int]$Matches[1] -lt 2) {
            throw 'Expected at least two production windows_external_drop tests; empty filters are not success'
          }
      - name: Legacy zlibx streaming regression test
        working-directory: src-tauri
        timeout-minutes: 5
        env:
          AEROFTP_EMBED_TEST_MANIFEST: '1'
        run: |
          $output = @(cargo test --locked --release --lib --no-default-features --features aerorsync,proton-native streaming_zlibx_preserves_adjacent_literal_flushes_across_batches -- --nocapture 2>&1)
          $status = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($status -ne 0) { exit $status }
          if (($output -join [Environment]::NewLine) -notmatch 'test result: ok\. 1 passed;') { throw 'Expected exactly one zlibx streaming regression test' }
      - name: Package portable GUI, runtime DLLs and hash manifests
        timeout-minutes: 10
        run: ./.github/scripts/external-upload-windows-package.ps1
      - name: Real disk File to production WebView2 native path runtime gate
        timeout-minutes: 10
        run: node scripts/test-windows-external-drop.mjs --exe external-upload-windows-portable/AeroFTP.exe --evidence external-upload-windows-evidence
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aeroftp-external-upload-windows-evidence-${{ github.sha }}
          path: external-upload-windows-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified Windows app for manual validation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aeroftp-external-upload-windows-x64-${{ github.sha }}
          path: external-upload-windows-artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Purge transient whisper artifacts before cache save
        if: always()
        run: |
          foreach ($profile in @('debug', 'release')) {
            $base = "src-tauri/target/$profile/build"
            if (Test-Path $base) {
              Get-ChildItem $base -Directory -Filter 'whisper-rs-sys-*' | Remove-Item -Recurse -Force -ErrorAction Stop
            }
          }
