[package]
name = "aeroftp-windows-drop-bridge-check"
version = "0.0.0"
edition = "2021"
publish = false

# Compile the production bridge without AeroFTP's unrelated native dependencies.
# Keep the Tauri family aligned with src-tauri/Cargo.toml.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
url = "2"
tauri = { version = "=2.11.0", default-features = false, features = ["wry"] }
tauri-runtime = { version = "~2.11.3", default-features = false }
tauri-runtime-wry = { version = "~2.11.4", default-features = false }
tauri-utils = { version = "~2.9.3", default-features = false }
tauri-codegen = { version = "~2.6.3", default-features = false }
webview2-com = "=0.38.2"
windows-core = "=0.61.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(dev)'] }
